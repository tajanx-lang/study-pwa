<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>정밀 자막 동기화 재생</title>
    <meta name="theme-color" content="#1c1d21">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
    <style>
        /* index.html 의 자막 재생 화면과 같은 모양 */
        :root { --gold: #f3c969; --serif: "Noto Serif KR", serif; --sans: "Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif; }
        * { box-sizing: border-box; }
        body { font-family: var(--sans); margin: 0; padding: 0; background: #111214; color: #fff; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        /* 넓은 화면에서도 휴대폰 화면 크기의 카드처럼 가운데에 보이게 한다 */
        .top-player { flex: none; width: 100%; max-width: 640px; margin: 0 auto; padding: 12px 16px 14px; padding-top: max(12px, env(safe-area-inset-top)); background: #1c1d21; border-bottom: 1px solid #2a2b30; display: flex; flex-direction: column; gap: 10px; }
        @media (min-width: 660px) { .top-player { border-radius: 0 0 16px 16px; border: 1px solid #2a2b30; border-top: none; } }
        audio { width: 100%; height: 40px; }
        .back-btn { align-self: flex-start; color: #a9c8ef; text-decoration: none; font-size: 14px; font-weight: 700; background: none; border: none; padding: 4px 0; cursor: pointer; font-family: inherit; }
        .viewer-title { font-family: var(--serif); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lyrics-container { flex: 1; overflow-y: auto; width: 100%; max-width: 640px; margin: 0 auto; padding: 30px 20px 50vh; text-align: center; line-height: 2; font-size: 17px; color: #6f727a; }
        .lyric-line { color: #6f727a; transition: all 0.25s ease; margin: 14px 0; padding: 8px 14px; border-radius: 10px; }
        .lyric-line.active { color: var(--gold); font-size: 20px; font-weight: 700; background: rgba(243, 201, 105, 0.12); transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="top-player">
        <a class="back-btn" id="backBtn" href="index.html">‹ 목록으로</a>
        <div class="viewer-title" id="viewerTitle"></div>
        <audio id="audioPlayer" controls></audio>
    </div>
    <div class="lyrics-container" id="lyricsContainer">로딩 중...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://vdiogfisdouzvtnpuvoc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fgXbc2B32uYh8lWgqtFSjA_IaP2-4AG';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        // 블로그 글의 링크로 들어온 경우: '블로그로 돌아가기' (이 탭을 닫거나 이전 페이지로)
        const fromBlog = urlParams.get('from') === 'blog' || /blog\.naver\.com/.test(document.referrer);
        if (fromBlog) {
            const back = document.getElementById('backBtn');
            back.textContent = '‹ 블로그로 돌아가기';
            back.addEventListener('click', (e) => {
                e.preventDefault();
                window.close();
                setTimeout(() => {
                    if (history.length > 1) history.back();
                    else location.href = document.referrer || 'https://blog.naver.com/tajanx';
                }, 300);
            });
        }

        async function loadDocDetail() {
            let { data: doc, error } = await _supabase.from('documents').select('*').eq('id', docId).single();
            if (error || !doc) {
                document.getElementById('lyricsContainer').textContent = '데이터를 불러오지 못했습니다.';
                return;
            }

            document.getElementById('viewerTitle').textContent = doc.title || '';
            if (doc.title) document.title = doc.title + ' · 誦書律唱';

            // 오디오 설정
            const audio = document.getElementById('audioPlayer');
            if (doc.audio_url) {
                audio.src = doc.audio_url;
            }

            // 텍스트 문장 파싱
            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';
            
            const sentences = doc.content.split('\n').filter(s => s.trim().length > 0);
            sentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'line-' + idx;
                div.textContent = sent;
                container.appendChild(div);
            });

            const lines = document.querySelectorAll('.lyric-line');
            const syncData = doc.sync_data || []; // Supabase에 저장된 타임스탬프 배열

            audio.addEventListener('timeupdate', () => {
                if (!audio.duration || lines.length === 0) return;
                const currentTime = audio.currentTime;
                
                let activeIndex = 0;
                for (let i = 0; i < syncData.length; i++) {
                    if (currentTime >= syncData[i].start && currentTime <= syncData[i].end) {
                        activeIndex = i;
                        break;
                    } else if (currentTime > syncData[syncData.length - 1]?.end) {
                        activeIndex = syncData.length - 1;
                    }
                }

                lines.forEach((line, idx) => {
                    if (idx === activeIndex) {
                        if (!line.classList.contains('active')) {
                            line.classList.add('active');
                            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        line.classList.remove('active');
                    }
                });
            });
        }
        loadDocDetail();
    </script>
</body>
</html>
