name: PythonAnywhere Auto Extend

on:
  schedule:
    # 매달 1일마다 실행 (원하시는 주기로 변경 가능)
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동 테스트 가능

jobs:
  extend-pa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Python script to click extend button
        env:
          PA_USER_1: ${{ secrets.PA_USER_1 }}
          PA_PASS_1: ${{ secrets.PA_PASS_1 }}
          PA_USER_2: ${{ secrets.PA_USER_2 }}
          PA_PASS_2: ${{ secrets.PA_PASS_2 }}
        run: |
          python - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          def extend_account(username, password):
              if not username or not password:
                  print("계정 정보가 없습니다.")
                  return
              
              print(f"[{username}] PythonAnywhere 자동 연장 시작...")
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  
                  try:
                      # 1. 로그인 페이지 접속
                      page.goto("https://www.pythonanywhere.com/login/")
                      page.fill('input[name="auth-username"]', username)
                      page.fill('input[name="auth-password"]', password)
                      page.click('button[type="submit"]')
                      page.wait_for_load_state("networkidle")
                      
                      # 2. 웹앱 설정 페이지로 이동
                      page.goto(f"https://www.pythonanywhere.com/user/{username}/webapps/")
                      page.wait_for_load_state("networkidle")
                      
                      # 3. 노란색 연장 버튼("오늘부터 한 달 동안") 클릭 시도
                      # 텍스트가 포함된 버튼을 찾아 클릭합니다.
                      button = page.get_by_role("button", name="오늘부터 한 달 동안")
                      if button.is_count_greater_than(0) and button.first.is_visible():
                          button.first.click()
                          print(f"[{username}] 노란색 연장 버튼 클릭 성공!")
                          page.wait_for_timeout(3000)
                      else:
                          print(f"[{username}] 연장 버튼이 보이지 않거나 이미 연장된 상태입니다.")
                          
                  except Exception as e:
                      print(f"[{username}] 오류 발생: {e}")
                  finally:
                      browser.close()

          # 두 계정 실행
          extend_account(os.environ.get("PA_USER_1"), os.environ.get("PA_PASS_1"))
          extend_account(os.environ.get("PA_USER_2"), os.environ.get("PA_PASS_2"))
          EOF
