name: PythonAnywhere Auto Extend

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동 테스트 가능

jobs:
  extend-pa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Python script to click extend button
        env:
          PA_USER_1: ${{ secrets.PA_USER_1 }}
          PA_PASS_1: ${{ secrets.PA_PASS_1 }}
          PA_USER_2: ${{ secrets.PA_USER_2 }}
          PA_PASS_2: ${{ secrets.PA_PASS_2 }}
        run: |
          python - << 'EOF'
          import os
          from playwright.sync_api import sync_playwright

          def extend_account(username, password):
              if not username or not password:
                  print(f"[{username}] 계정 정보가 없습니다.")
                  return
              
              print(f"[{username}] PythonAnywhere 자동 연장 시작...")
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page()
                  
                  try:
                      # 1. 로그인 페이지 접속
                      page.goto("https://www.pythonanywhere.com/login/")
                      page.fill('input[name="auth-username"]', username)
                      page.fill('input[name="auth-password"]', password)
                      page.click('button[type="submit"]')
                      page.wait_for_load_state("networkidle")
                      
                      # 2. 웹앱 설정 페이지로 이동
                      page.goto(f"https://www.pythonanywhere.com/user/{username}/webapps/")
                      page.wait_for_load_state("networkidle")
                      
                      # 3. 노란색 연장 버튼("Run until 1 month from today") 찾기 및 클릭
                      button = page.get_by_text("Run until 1 month from today")
                      if button.count() > 0 and button.first.is_visible():
                          button.first.click()
                          print(f"[{username}] 'Run until 1 month from today' 버튼 클릭 성공!")
                          page.wait_for_timeout(3000)
                      else:
                          print(f"[{username}] 연장 버튼이 보이지 않습니다. (이미 연장되었거나 대상 아님)")
                          
                  except Exception as e:
                      print(f"[{username}] 오류 발생: {e}")
                      raise e
                  finally:
                      browser.close()

          extend_account(os.environ.get("PA_USER_1"), os.environ.get("PA_PASS_1"))
          extend_account(os.environ.get("PA_USER_2"), os.environ.get("PA_PASS_2"))
          EOF
