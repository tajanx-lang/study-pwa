name: Supabase Keep Alive

on:
  schedule:
    # 매주 월요일 오전 9시 (UTC 기준 0시)에 실행
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동으로도 테스트 실행 가능

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase project to keep it alive..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          echo "HTTP Response Code: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 401 ]; then
            echo "Successfully pinged Supabase!"
          else
            echo "Failed with response code: $response"
            exit 1
          fi
