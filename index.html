<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f3a5f">
    <title>誦書律唱(송서율창) 클라우드</title>
    <link rel="manifest" href="manifest.json">
    <!-- 글꼴: 제목은 명조체(Noto Serif KR), 본문은 고딕체(Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 색과 모양을 한곳에서 정한다 (한지 바탕 + 먹색 글씨 + 남색·초록 포인트) */
        :root {
            --bg: #f4efe4;
            --paper: #fffdf8;
            --ink: #2b2925;
            --muted: #7b7366;
            --line: #e7dfcf;
            --navy: #1f3a5f;
            --navy-soft: #eaf0f6;
            --green: #2f6b4f;
            --green-soft: #ebf4ee;
            --red: #a8322a;
            --red-soft: #fbeceb;
            --gold: #f3c969;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(60, 45, 20, 0.06), 0 4px 14px rgba(60, 45, 20, 0.06);
            --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
            --sans: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        button, input { font-family: inherit; }

        /* 넓은 화면에서도 휴대폰 화면 폭으로 가운데에 놓는다 */
        #main-view { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

        /* ── 머리말 ── */
        .hero {
            text-align: center;
            padding: 36px 12px 26px;
        }
        .hero-seal {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; margin-bottom: 12px;
            border-radius: 10px;
            background: var(--red); color: #fff;
            font-family: var(--serif); font-size: 24px; font-weight: 700;
            box-shadow: 0 3px 10px rgba(168, 50, 42, 0.25);
        }
        .hero-title {
            margin: 0;
            font-family: var(--serif);
            font-size: 34px; font-weight: 700; letter-spacing: 6px;
            color: var(--navy);
        }
        .hero-sub { margin: 4px 0 0; font-size: 15px; font-weight: 500; color: var(--navy); letter-spacing: 1px; }
        .hero-desc { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

        .section-label {
            margin: 28px 4px 10px;
            font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 1px;
        }

        /* ── 접고 펴는 목록 공통 ── */
        details > summary { list-style: none; cursor: pointer; user-select: none; -webkit-user-select: none; }
        details > summary::-webkit-details-marker { display: none; }
        .chev {
            flex: none; width: 8px; height: 8px; margin-left: 10px;
            border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
            transform: rotate(-45deg); opacity: 0.5; transition: transform 0.2s;
        }
        details[open] > summary .chev { transform: rotate(45deg); }
        .count {
            flex: none; margin-left: auto;
            font-size: 12px; font-weight: 700;
            padding: 2px 9px; border-radius: 999px;
        }

        /* 과목(큰 분류) */
        .cat {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            overflow: hidden;
        }
        .cat-summary {
            display: flex; align-items: center; gap: 10px;
            padding: 16px 18px;
            font-family: var(--serif); font-size: 17px; font-weight: 700; color: var(--navy);
        }
        .cat-summary .count { background: var(--navy-soft); color: var(--navy); font-family: var(--sans); }
        .cat[open] > .cat-summary { border-bottom: 1px solid var(--line); background: linear-gradient(#fffdf8, #fbf7ee); }
        .cat-body { padding: 10px 12px 12px; }

        /* 분류(작은 분류) */
        .subcat {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fffefb;
            margin: 8px 0;
            overflow: hidden;
        }
        .subcat-summary {
            display: flex; align-items: center; gap: 8px;
            padding: 13px 14px;
            font-size: 15px; font-weight: 700; color: var(--green);
        }
        .subcat-summary .count { background: var(--green-soft); color: var(--green); }
        .subcat[open] > .subcat-summary { border-bottom: 1px dashed var(--line); }
        .subcat-body { padding: 6px 8px 8px; }

        /* 폴더 안 맨 위: 전체선택 · 연속 재생 */
        .folder-controls {
            display: flex; justify-content: space-between; align-items: center; gap: 8px;
            padding: 8px 6px 10px;
            font-size: 13px;
        }
        .folder-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
        .folder-controls input, .doc-checkbox { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: var(--green); }
        .btn-playlist-play {
            background: var(--green); color: #fff; border: none;
            padding: 8px 14px; border-radius: 999px;
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-playlist-play:hover { background: #255a42; }
        .btn-playlist-play:active { transform: scale(0.97); }

        /* 문서 한 개 */
        .doc {
            display: flex; align-items: flex-start;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            margin: 6px 0;
            transition: border-color 0.2s;
        }
        .doc:hover { border-color: #d8cbb2; }
        .doc-details { flex: 1; min-width: 0; }
        .doc-summary {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 6px 12px 14px;
            font-size: 15px; color: var(--ink);
        }
        .doc-title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .doc-badge { flex: none; font-size: 12px; opacity: 0.7; }
        .doc-details[open] > .doc-summary { font-weight: 700; color: var(--navy); }
        .doc-check { flex: none; display: flex; align-items: center; padding: 13px 14px 13px 8px; cursor: pointer; }

        .doc-content { padding: 4px 14px 14px; }
        .audio-label { font-size: 12px; color: var(--muted); margin: 0 0 8px; overflow-wrap: anywhere; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            width: 100%; padding: 11px 12px;
            border-radius: 10px; border: none;
            font-size: 14px; font-weight: 700; text-decoration: none;
            cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-view { background: var(--navy); color: #fff; margin-bottom: 8px; }
        .btn-view:hover { background: #18304f; }
        .btn-row { display: flex; gap: 8px; }
        .btn-light { background: var(--navy-soft); color: var(--navy); font-size: 13px; padding: 9px 10px; white-space: nowrap; }
        .btn-light:hover { background: #dce6f0; }
        .link-input {
            width: 100%; margin-top: 8px; padding: 7px 10px;
            font-size: 11px; color: var(--muted);
            border: 1px solid var(--line); border-radius: 8px; background: #faf7f0;
        }
        .no-audio { font-size: 13px; color: var(--red); background: var(--red-soft); padding: 10px; border-radius: 10px; text-align: center; }

        .loading, .empty, .error { text-align: center; padding: 48px 12px; color: var(--muted); font-size: 15px; }
        .error { color: var(--red); }
        .spinner {
            width: 28px; height: 28px; margin: 0 auto 12px;
            border: 3px solid var(--line); border-top-color: var(--navy); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 바깥 사이트 바로가기 ── */
        .link-buttons-container { display: grid; gap: 10px; }
        .external-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px;
            background: var(--paper);
            border: 1px solid var(--line); border-left: 4px solid var(--accent);
            border-radius: 12px;
            box-shadow: var(--shadow);
            color: var(--ink); text-decoration: none;
            font-size: 14px; font-weight: 700;
            transition: transform 0.1s, border-color 0.2s;
        }
        .external-btn:hover { transform: translateY(-1px); }
        .external-btn .ext-icon { font-size: 20px; }
        .external-btn .ext-arrow { margin-left: auto; color: var(--muted); font-weight: 400; }
        .btn-saju { --accent: var(--navy); }
        .btn-yeok { --accent: var(--green); }
        .btn-cafe { --accent: var(--red); }

        /* ── 사용자 인증 코드 ── */
        .auth-code-container {
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            margin-top: 10px;
            padding: 14px 16px;
            background: var(--paper);
            border: 1px dashed #d3c6ad;
            border-radius: 12px;
        }
        .auth-btn-label { font-size: 13px; font-weight: 700; color: var(--muted); }
        .auth-right { display: flex; align-items: center; gap: 8px; }
        .auth-code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 17px; font-weight: 700; letter-spacing: 2px;
            color: var(--red); background: var(--red-soft);
            padding: 5px 12px; border-radius: 8px;
        }
        .copy-btn {
            background: var(--navy); color: #fff; border: none;
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .copy-btn:hover { background: #18304f; }

        .footer-note { text-align: center; margin-top: 28px; font-size: 12px; color: #a59c8c; }

        /* ── 전체 화면 자막 재생 화면 ── */
        #viewer-container {
            display: none;
            position: fixed; inset: 0;
            height: 100vh; height: 100dvh;
            background: #111214; color: #fff;
            flex-direction: column;
            z-index: 1000;
        }
        .top-player {
            flex: none;
            width: 100%; max-width: 640px; margin: 0 auto;
            padding: 12px 16px 14px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: #1c1d21;
            border-bottom: 1px solid #2a2b30;
            display: flex; flex-direction: column; gap: 10px;
        }
        @media (min-width: 660px) { .top-player { border-radius: 0 0 16px 16px; border: 1px solid #2a2b30; border-top: none; } }
        .player-info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
        .back-btn {
            color: #a9c8ef; text-decoration: none; font-weight: 700; cursor: pointer;
            background: none; border: none; padding: 4px 0; font-size: 14px;
        }
        .repeat-label { color: #ddd; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
        .repeat-label input { width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: var(--gold); }
        .now-playing { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
        .playlist-status {
            flex: none; font-size: 12px; font-weight: 700; color: #111;
            background: var(--gold); padding: 2px 8px; border-radius: 999px;
        }
        .viewer-title {
            min-width: 0; font-family: var(--serif); font-size: 17px; font-weight: 700; color: #fff;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .top-player audio { width: 100%; height: 40px; }

        .lyrics-container {
            flex: 1; overflow-y: auto;
            width: 100%; max-width: 640px; margin: 0 auto;
            padding: 30px 20px 50vh;
            text-align: center; line-height: 2; font-size: 17px;
        }
        .lyric-line { color: #6f727a; transition: all 0.25s ease; margin: 14px 0; padding: 8px 14px; border-radius: 10px; }
        .lyric-line.active {
            color: var(--gold); font-size: 20px; font-weight: 700;
            background: rgba(243, 201, 105, 0.12);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div id="main-view">
        <header class="hero">
            <div class="hero-seal">誦</div>
            <h1 class="hero-title">誦書律唱</h1>
            <p class="hero-sub">송서율창 클라우드</p>
            <p class="hero-desc">과목을 펼쳐 문서를 고르고, 자막과 함께 들어 보세요.</p>
        </header>

        <div id="app" class="loading"><div class="spinner"></div>데이터를 불러오는 중입니다...</div>

        <!-- 외부 링크 버튼 영역 -->
        <div class="section-label">바로가기</div>
        <div class="link-buttons-container">
            <a href="https://cskim120.pythonanywhere.com/" target="_blank" class="external-btn btn-saju"><span class="ext-icon">🔮</span>자미두수 명반 &amp; 心易(심역)<span class="ext-arrow">↗</span></a>
            <a href="https://tajanx.pythonanywhere.com/" target="_blank" class="external-btn btn-yeok"><span class="ext-icon">📜</span>선천 역서(先天 易數)<span class="ext-arrow">↗</span></a>
            <a href="https://cafe.daum.net/kangchang" target="_blank" class="external-btn btn-cafe"><span class="ext-icon">☕</span>강철의 心易 자미두수 카페<span class="ext-arrow">↗</span></a>
        </div>

        <!-- 사용자 인증 코드 버튼 및 출력 영역 -->
        <div class="auth-code-container">
            <div class="auth-btn-label">🔑 이달의 사용자 인증 코드</div>
            <div class="auth-right">
                <span id="authCodeText" class="auth-code">로딩중...</span>
                <button class="copy-btn" onclick="copyAuthCode()">복사</button>
            </div>
        </div>

        <div class="footer-note">誦書律唱 · 송서율창</div>
    </div>

    <!-- 전체 화면 자막 동기화 뷰어 -->
    <div id="viewer-container">
        <div class="top-player">
            <div class="player-info-row">
                <button class="back-btn" onclick="closeViewer()">‹ 목록으로</button>
                <label class="repeat-label">
                    <input type="checkbox" id="repeatCheckbox"> 🔁 반복재생
                </label>
            </div>
            <div class="now-playing">
                <span id="playlistStatus" class="playlist-status">1 / 1</span>
                <span id="viewerTitle" class="viewer-title"></span>
            </div>
            <audio id="audioPlayer" controls></audio>
        </div>
        <div class="lyrics-container" id="lyricsContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vdiogfisdouzvtnpuvoc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fgXbc2B32uYh8lWgqtFSjA_IaP2-4AG";

        let supabaseClient;
        let allDocuments = [];
        let currentPlaylist = [];
        let currentPlaylistIndex = 0;

        function initMonthlyAuthCode() {
            try {
                const secretSalt = "My_Super_Secret_Key_2026_StudyRoom!";
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const combined = `${secretSalt}_${year}-${month}`;
                const hash = CryptoJS.MD5(combined).toString();
                const code = hash.substring(0, 8).toUpperCase();
                document.getElementById('authCodeText').textContent = code;
            } catch (e) {
                document.getElementById('authCodeText').textContent = "ERROR";
            }
        }

        function copyAuthCode() {
            const codeText = document.getElementById('authCodeText').textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText).then(() => {
                    alert('인증 코드가 복사되었습니다: ' + codeText);
                }).catch(() => { fallbackCopy(codeText); });
            } else {
                fallbackCopy(codeText);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                alert('인증 코드가 복사되었습니다: ' + text);
            } catch (err) {
                alert('복사 실패. 코드를 직접 복사해 주세요.');
            }
            document.body.removeChild(textarea);
        }

        // 💡 오디오 링크 복사 함수 추가
        function copyAudioLink(elementId) {
            const inputElement = document.getElementById(elementId);
            const fullUrl = inputElement.value;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    alert("공유 링크가 복사되었습니다!\n" + fullUrl);
                }).catch(() => {
                    fallbackCopyLink(inputElement, fullUrl);
                });
            } else {
                fallbackCopyLink(inputElement, fullUrl);
            }
        }

        function fallbackCopyLink(inputElement, fullUrl) {
            inputElement.select();
            inputElement.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                alert("링크가 복사되었습니다: " + fullUrl);
            } catch (err) {
                alert("브라우저가 클립보드 복사를 지원하지 않습니다. 주소를 직접 복사해주세요.");
            }
        }

        function naturalSort(a, b) {
            return a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' });
        }

        async function loadData() {
            const appDiv = document.getElementById('app');
            try {
                if (!window.supabase) {
                    throw new Error("Supabase 스크립트가 로드되지 않았습니다.");
                }
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                const { data, error } = await supabaseClient
                    .from('documents')
                    .select('id, category, sub_category, title, audio_url, content, sync_data');

                if (error) throw error;
                if (!data || data.length === 0) {
                    appDiv.className = 'empty';
                    appDiv.innerHTML = '저장된 문서가 없습니다.';
                    return;
                }

                allDocuments = data;
                const treeData = {};

                data.forEach(row => {
                    const cat = row.category || "기타";
                    const sub = row.sub_category ? row.sub_category.trim() : "";

                    if (!treeData[cat]) {
                        treeData[cat] = { _files: [], _subcats: {} };
                    }

                    if (sub === "") {
                        treeData[cat]._files.push(row);
                    } else {
                        if (!treeData[cat]._subcats[sub]) {
                            treeData[cat]._subcats[sub] = [];
                        }
                        treeData[cat]._subcats[sub].push(row);
                    }
                });

                let html = '<div class="section-label" style="margin-top:0">공부 자료</div>';
                const sortedCategories = Object.keys(treeData).sort(naturalSort);

                sortedCategories.forEach((cat, catIndex) => {
                    const content = treeData[cat];
                    const total = content._files.length + Object.values(content._subcats).reduce((n, docs) => n + docs.length, 0);
                    html += `<details class="cat"><summary class="cat-summary"><span>📚</span><span>${escapeHtml(cat)}</span><span class="count">${total}</span><span class="chev"></span></summary><div class="cat-body">`;

                    if (content._files.length > 0) {
                        content._files.sort((a, b) => naturalSort(a.title, b.title));
                        // 한글 이름은 모두 '_'로 바뀌어 겹칠 수 있으므로 순번으로 id 를 만든다
                        const folderId = `cat_${catIndex}`;
                        html += renderFolderControls(folderId) + `<div id="${folderId}">`;
                        content._files.forEach(doc => {
                            html += renderDocBox(doc, folderId);
                        });
                        html += `</div>`;
                    }

                    const sortedSubcats = Object.keys(content._subcats).sort(naturalSort);
                    sortedSubcats.forEach((subcat, subIndex) => {
                        const docs = content._subcats[subcat];
                        docs.sort((a, b) => naturalSort(a.title, b.title));
                        const folderId = `sub_${catIndex}_${subIndex}`;

                        html += `<details class="subcat"><summary class="subcat-summary"><span>📁</span><span>${escapeHtml(subcat)}</span><span class="count">${docs.length}</span><span class="chev"></span></summary><div class="subcat-body">`;
                        html += renderFolderControls(folderId) + `<div id="${folderId}">`;
                        docs.forEach(doc => {
                            html += renderDocBox(doc, folderId);
                        });
                        html += `</div></div></details>`;
                    });

                    html += `</div></details>`;
                });

                appDiv.className = '';
                appDiv.innerHTML = html;

                // 💡 공유된 링크(?title=문서이름)로 접속했을 경우 자동 실행
                const urlParams = new URLSearchParams(window.location.search);
                const targetTitle = urlParams.get('title');
                if (targetTitle) {
                    setTimeout(() => {
                        openViewerByTitle(targetTitle);
                    }, 300);
                }

            } catch (err) {
                appDiv.className = 'error';
                appDiv.innerHTML = `데이터 로드 오류: ${escapeHtml(err.message)}`;
            }
        }

        function renderFolderControls(folderId) {
            return `
                <div class="folder-controls">
                    <label><input type="checkbox" onchange="toggleSelectAll(this, '${folderId}')"> 전체선택</label>
                    <button class="btn-playlist-play" onclick="playSelectedFolder('${folderId}')">▶ 선택 연속 재생</button>
                </div>
            `;
        }

        // 문서 이름·분류에 < > " ' 같은 기호가 있어도 화면이 깨지지 않도록 글자로만 표시한다.
        // 버튼에는 이름 대신 문서 번호를 넘긴다. Supabase id 는 UUID(글자)라 숫자로 바꿀 수 없으므로,
        // allDocuments 안에서의 위치(0, 1, 2 …)를 번호로 쓴다.
        function renderDocBox(doc, folderId) {
            const id = allDocuments.indexOf(doc);
            const audioName = `${doc.title}.mp3`;
            const shareUrl = `${window.location.origin}${window.location.pathname}?title=${encodeURIComponent(doc.title)}`;
            let audioContentHtml = doc.audio_url ? `
                <div class="audio-label">🎵 ${escapeHtml(audioName)}</div>
                <a class="btn btn-view" onclick="openViewerById(${id})">▶ 자막과 함께 듣기</a>
                <div class="btn-row">
                    <a class="btn btn-light" onclick="downloadAudioById(${id})">📥 내려받기</a>
                    <button class="btn btn-light" onclick="copyAudioLink('link-${id}')">🔗 링크 복사</button>
                </div>
                <input type="text" id="link-${id}" class="link-input" value="${escapeHtml(shareUrl)}" readonly>
            ` : `<div class="no-audio">⚠️ 연결된 오디오 파일이 없습니다.</div>`;

            return `
                <div class="doc">
                    <details class="doc-details">
                        <summary class="doc-summary">
                            <span class="doc-title">${escapeHtml(doc.title)}</span>
                            ${doc.audio_url ? '<span class="doc-badge" title="음성 있음">🎵</span>' : ''}
                            <span class="chev"></span>
                        </summary>
                        <div class="doc-content">
                            ${audioContentHtml}
                        </div>
                    </details>
                    <label class="doc-check"><input type="checkbox" class="doc-checkbox ${folderId}" value="${id}"></label>
                </div>
            `;
        }

        function openViewerById(id) {
            const doc = allDocuments[id];
            if (doc) openViewerByTitle(doc.title);
        }

        function downloadAudioById(id) {
            const doc = allDocuments[id];
            if (doc && doc.audio_url) downloadAudioFile(doc.audio_url, `${doc.title}.mp3`);
        }

        function toggleSelectAll(masterCheckbox, folderId) {
            const checkboxes = document.querySelectorAll(`input.doc-checkbox.${folderId}`);
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        function playSelectedFolder(folderId) {
            const checkboxes = document.querySelectorAll(`input.doc-checkbox.${folderId}:checked`);
            if (checkboxes.length === 0) {
                alert("재생할 문서를 하나 이상 선택해주세요.");
                return;
            }

            currentPlaylist = [];
            checkboxes.forEach(cb => {
                const doc = allDocuments[Number(cb.value)];
                if (doc && doc.audio_url) {
                    currentPlaylist.push(doc);
                }
            });

            if (currentPlaylist.length === 0) {
                alert("선택된 문서 중 오디오가 연결된 파일이 없습니다.");
                return;
            }

            currentPlaylistIndex = 0;
            startPlaylistPlayback();
        }

        function openViewerByTitle(title) {
            const doc = allDocuments.find(d => d.title === title);
            if (!doc || !doc.audio_url) {
                alert("연결된 오디오 파일이 없습니다.");
                return;
            }
            currentPlaylist = [doc];
            currentPlaylistIndex = 0;
            startPlaylistPlayback();
        }

        function startPlaylistPlayback() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'flex';
            loadAndPlayIndex(currentPlaylistIndex);
        }

        function loadAndPlayIndex(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            currentPlaylistIndex = index;

            const doc = currentPlaylist[index];
            document.getElementById('playlistStatus').textContent = `${index + 1} / ${currentPlaylist.length}`;
            document.getElementById('viewerTitle').textContent = doc.title;

            const audio = document.getElementById('audioPlayer');
            audio.src = doc.audio_url || '';

            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';
            container.scrollTop = 0;

            const finalSentences = [];
            if (doc.content) {
                doc.content.split(/\r?\n/).forEach(line => {
                    if (!line.trim()) return;
                    const matches = line.match(/([^\r\n.!?]+[.!?]*['"”’]*)/g);
                    if (matches) {
                        matches.forEach(m => {
                            const s = m.trim();
                            if (s) finalSentences.push(s);
                        });
                    } else {
                        finalSentences.push(line.trim());
                    }
                });
            }
            if (finalSentences.length === 0) finalSentences.push("내용이 없습니다.");

            finalSentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'line-' + idx;
                div.textContent = sent;
                container.appendChild(div);
            });

            const lines = document.querySelectorAll('.lyric-line');
            let rawSyncData = doc.sync_data;

            audio.ontimeupdate = () => {
                if (!audio.duration || isNaN(audio.duration) || lines.length === 0) return;
                const currentTime = audio.currentTime;
                let activeIndex = 0;

                if (rawSyncData && Array.isArray(rawSyncData) && rawSyncData.length === finalSentences.length) {
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (currentTime >= rawSyncData[i].start && currentTime <= rawSyncData[i].end) {
                            activeIndex = i;
                            break;
                        } else if (currentTime > rawSyncData[rawSyncData.length - 1].end) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else if (rawSyncData && Array.isArray(rawSyncData)) {
                    const progress = currentTime / audio.duration;
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (progress >= rawSyncData[i].start_ratio && progress <= rawSyncData[i].end_ratio) {
                            activeIndex = i;
                            break;
                        } else if (progress > rawSyncData[rawSyncData.length - 1].end_ratio) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else {
                    const progress = currentTime / audio.duration;
                    activeIndex = Math.min(Math.floor(progress * finalSentences.length), finalSentences.length - 1);
                }

                lines.forEach((line, idx) => {
                    if (idx === activeIndex) {
                        if (!line.classList.contains('active')) {
                            line.classList.add('active');
                            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        line.classList.remove('active');
                    }
                });
            };

            audio.onended = () => {
                const isRepeat = document.getElementById('repeatCheckbox').checked;
                if (currentPlaylistIndex + 1 < currentPlaylist.length) {
                    loadAndPlayIndex(currentPlaylistIndex + 1);
                } else {
                    if (isRepeat) {
                        loadAndPlayIndex(0);
                    } else {
                        alert("모든 곡의 재생이 완료되었습니다.");
                        closeViewer();
                    }
                }
            };

            audio.play().catch(e => console.log("자동 재생 제한:", e));
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
        }

        async function downloadAudioFile(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.download = filename;
                a.click();
            }
        }

        function closeViewer() {
            const audio = document.getElementById('audioPlayer');
            audio.pause();
            audio.currentTime = 0;
            audio.onended = null;
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        document.addEventListener("DOMContentLoaded", () => {
            initMonthlyAuthCode();
            loadData();
        });
    </script>
</body>
</html>
