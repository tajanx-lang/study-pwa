<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>誦書律唱(송서율창) 클라우드</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f2f4f7; margin: 0; }
        h2 { color: #0b3c5d; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        details { background: white; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        summary { padding: 14px 16px; font-weight: bold; cursor: pointer; outline: none; display: flex; align-items: center; user-select: none; }
        .cat-summary { font-size: 17px; color: #0b3c5d; background: #eef3f8; border-bottom: 1px solid #d0e1fd; }
        .subcat-summary { font-size: 15px; color: #1e6f3d; background: #f4f8f4; margin: 6px 10px; border-radius: 8px; border: 1px solid #c8e6c9; }
        
        .doc-summary { font-size: 14px; color: #333; background: #fafafa; margin: 6px 15px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .doc-content { padding: 12px; background: #fff; border-top: 1px solid #eee; }
        .audio-label { font-size: 12px; color: #555; margin: 6px 0 2px 2px; font-weight: bold; }
        .btn-view { display: block; text-align: center; background: #2e7d32; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .btn-download { display: block; text-align: center; background: #007aff; color: white; padding: 8px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; cursor: pointer; }
        .no-audio { font-size: 12px; color: #d32f2f; background: #ffebee; padding: 8px; border-radius: 6px; text-align: center; }
        .loading { text-align: center; color: #777; margin-top: 40px; font-size: 15px; }

        /* 💡 하단 외부 링크 버튼 스타일 */
        .link-buttons-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 35px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .external-btn {
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            flex: 1;
            min-width: 180px;
            max-width: 250px;
        }
        .external-btn:hover {
            transform: translateY(-2px);
        }
        .btn-saju { background-color: #0b3c5d; }
        .btn-saju:hover { background-color: #124e78; }
        .btn-yeok { background-color: #1e6f3d; }
        .btn-yeok:hover { background-color: #278c4d; }
        .btn-cafe { background-color: #b71c1c; }
        .btn-cafe:hover { background-color: #c62828; }

        /* 전체 화면 뷰어 스타일 */
        #viewer-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #121212; color: #fff; flex-direction: column; z-index: 1000; }
        .top-player { position: fixed; top: 0; left: 0; width: 100%; background: #1f1f1f; padding: 15px; box-sizing: border-box; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .top-player audio { width: 100%; }
        .back-btn { display: inline-block; margin-bottom: 8px; color: #90caf9; text-decoration: none; font-size: 14px; font-weight: bold; cursor: pointer; }
        .lyrics-container { margin-top: 130px; padding: 25px 20px; overflow-y: auto; flex: 1; text-align: center; line-height: 2.2; font-size: 17px; }
        .lyric-line { color: #777; transition: all 0.2s ease; margin: 20px 0; padding: 8px 12px; border-radius: 8px; }
        .lyric-line.active { color: #ffeb3b; font-size: 20px; font-weight: bold; background: rgba(255, 235, 59, 0.15); transform: scale(1.03); }
    </style>
</head>
<body>
    <div id="main-view">
        <h2>📜 誦書律唱(송서율창) 클라우드</h2>
        <div class="subtitle">과목 ➔ 분류 ➔ 문서 아코디언 트리 시스템 (순서 정렬 적용)</div>
        <div id="app" class="loading">데이터를 불러오는 중입니다...</div>

        <!-- 💡 요청하신 세 가지 외부 링크 버튼 영역 -->
        <div class="link-buttons-container">
            <a href="https://cskim120.pythonanywhere.com/" target="_blank" class="external-btn btn-saju">🔮 자미두수 명반&心易(심역)</a>
            <a href="https://tajanx.pythonanywhere.com/" target="_blank" class="external-btn btn-yeok">📜 선천 역서(先天 易數)</a>
            <a href="https://cafe.daum.net/kangchang" target="_blank" class="external-btn btn-cafe">☕ 강철의 心易 자미두수-사이트</a>
        </div>
    </div>

    <!-- 전체 화면 자막 동기화 뷰어 -->
    <div id="viewer-container">
        <div class="top-player">
            <a class="back-btn" onclick="closeViewer()">⬅ 목록으로 돌아가기</a>
            <audio id="audioPlayer" controls></audio>
        </div>
        <div class="lyrics-container" id="lyricsContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vdiogfisdouzvtnpuvoc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fgXbc2B32uYh8lWgqtFSjA_IaP2-4AG";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allDocuments = [];

        function naturalSort(a, b) {
            return a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' });
        }

        async function loadData() {
            const appDiv = document.getElementById('app');
            try {
                const { data, error } = await supabaseClient
                    .from('documents')
                    .select('id, category, sub_category, title, audio_url, content, sync_data');

                if (error) throw error;
                if (!data || data.length === 0) {
                    appDiv.innerHTML = '<div style="text-align:center; color:#777; margin-top:40px;">저장된 문서가 없습니다.</div>';
                    return;
                }

                allDocuments = data;
                const treeData = {};
                
                data.forEach(row => {
                    const cat = row.category || "기타";
                    const sub = row.sub_category ? row.sub_category.trim() : "";
                    
                    if (!treeData[cat]) {
                        treeData[cat] = { _files: [], _subcats: {} };
                    }

                    if (sub === "") {
                        treeData[cat]._files.push(row);
                    } else {
                        if (!treeData[cat]._subcats[sub]) {
                            treeData[cat]._subcats[sub] = [];
                        }
                        treeData[cat]._subcats[sub].push(row);
                    }
                });

                let html = '';
                const sortedCategories = Object.keys(treeData).sort(naturalSort);

                for (const cat of sortedCategories) {
                    const content = treeData[cat];
                    html += `<details><summary class="cat-summary">📚 ${cat}</summary><div style="padding: 10px;">`;
                    
                    content._files.sort((a, b) => naturalSort(a.title, b.title));
                    content._files.forEach(doc => {
                        html += renderDocBox(doc);
                    });

                    const sortedSubcats = Object.keys(content._subcats).sort(naturalSort);
                    for (const subcat of sortedSubcats) {
                        html += `<details class="subcat-summary"><summary>📁 ${subcat}</summary><div style="padding: 5px;">`;
                        
                        const docs = content._subcats[subcat];
                        docs.sort((a, b) => naturalSort(a.title, b.title));
                        docs.forEach(doc => {
                            html += renderDocBox(doc);
                        });
                        html += `</div></details>`;
                    }

                    html += `</div></details>`;
                }

                appDiv.innerHTML = html;
            } catch (err) {
                appDiv.innerHTML = `<div style="text-align:center; color:#d32f2f; margin-top:40px;">데이터 로드 오류: ${err.message}</div>`;
            }
        }

        function renderDocBox(doc) {
            let audioName = `${doc.title}.mp3`;
            let audioContentHtml = doc.audio_url ? `
                <div class="audio-label">🎵 ${audioName}</div>
                <a class="btn-view" onclick="openViewer('${doc.title}')">📖 정밀 자막과 함께 듣기</a>
                <a class="btn-download" onclick="downloadAudioFile('${doc.audio_url}', '${audioName}')">📥 다운로드 (${audioName})</a>
            ` : `<div class="no-audio">⚠️ 연결된 오디오 파일이 없습니다.</div>`;

            return `
                <details class="doc-summary">
                    <summary>📄 ${doc.title}</summary>
                    <div class="doc-content">
                        ${audioContentHtml}
                    </div>
                </details>
            `;
        }

        async function downloadAudioFile(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.download = filename;
                a.click();
            }
        }

        function openViewer(title) {
            const doc = allDocuments.find(d => d.title === title);
            if (!doc) return;

            document.getElementById('main-view').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'flex';

            const audio = document.getElementById('audioPlayer');
            audio.src = doc.audio_url || '';

            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';

            const finalSentences = [];
            if (doc.content) {
                doc.content.split(/\r?\n/).forEach(line => {
                    if (!line.trim()) return;
                    const matches = line.match(/([^\r\n.!?]+[.!?]*['"”’]*)/g);
                    if (matches) {
                        matches.forEach(m => {
                            const s = m.trim();
                            if (s) finalSentences.push(s);
                        });
                    } else {
                        finalSentences.push(line.trim());
                    }
                });
            }
            if (finalSentences.length === 0) finalSentences.push("내용이 없습니다.");

            finalSentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'line-' + idx;
                div.textContent = sent;
                container.appendChild(div);
            });

            const lines = document.querySelectorAll('.lyric-line');
            let rawSyncData = doc.sync_data;

            audio.ontimeupdate = () => {
                if (!audio.duration || isNaN(audio.duration) || lines.length === 0) return;
                const currentTime = audio.currentTime;
                let activeIndex = 0;

                if (rawSyncData && Array.isArray(rawSyncData) && rawSyncData.length === finalSentences.length) {
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (currentTime >= rawSyncData[i].start && currentTime <= rawSyncData[i].end) {
                            activeIndex = i;
                            break;
                        } else if (currentTime > rawSyncData[rawSyncData.length - 1].end) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else if (rawSyncData && Array.isArray(rawSyncData)) {
                    const progress = currentTime / audio.duration;
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (progress >= rawSyncData[i].start_ratio && progress <= rawSyncData[i].end_ratio) {
                            activeIndex = i;
                            break;
                        } else if (progress > rawSyncData[rawSyncData.length - 1].end_ratio) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else {
                    const progress = currentTime / audio.duration;
                    activeIndex = Math.min(Math.floor(progress * finalSentences.length), finalSentences.length - 1);
                }

                lines.forEach((line, idx) => {
                    if (idx === activeIndex) {
                        if (!line.classList.contains('active')) {
                            line.classList.add('active');
                            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        line.classList.remove('active');
                    }
                });
            };
            audio.play().catch(e => console.log("자동 재생 제한:", e));
        }

        function closeViewer() {
            const audio = document.getElementById('audioPlayer');
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        loadData();
    </script>
</body>
</html>
