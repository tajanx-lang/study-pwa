<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>誦書律唱(송서율창) 클라우드</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CryptoJS MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f2f4f7; margin: 0; -webkit-text-size-adjust: 100%; }
        h2 { color: #0b3c5d; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        details { background: white; margin-bottom: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; }
        summary { padding: 14px 16px; font-weight: bold; cursor: pointer; outline: none; display: flex; align-items: center; user-select: none; -webkit-user-select: none; }
        .cat-summary { font-size: 17px; color: #0b3c5d; background: #eef3f8; border-bottom: 1px solid #d0e1fd; }
        .subcat-summary { font-size: 15px; color: #1e6f3d; background: #f4f8f4; margin: 6px 10px; border-radius: 8px; border: 1px solid #c8e6c9; }
        
        /* 폴더 내부 상단 컨트롤 바 (전체선택 및 연속재생 버튼) */
        .folder-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; font-size: 13px; font-weight: bold; }
        .folder-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; }
        .btn-playlist-play { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-playlist-play:hover { background: #1b5e20; }

        .doc-summary { font-size: 14px; color: #333; background: #fafafa; margin: 6px 15px; border-radius: 8px; border: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; padding-right: 15px; }
        .doc-summary summary { flex: 1; padding: 12px 16px; }
        .doc-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: #2e7d32; }

        .doc-content { padding: 12px; background: #fff; border-top: 1px solid #eee; }
        .audio-label { font-size: 12px; color: #555; margin: 6px 0 2px 2px; font-weight: bold; }
        .btn-view { display: block; text-align: center; background: #2e7d32; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 13px; margin-bottom: 8px; cursor: pointer; }
        .btn-download { display: block; text-align: center; background: #007aff; color: white; padding: 8px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; cursor: pointer; }
        .no-audio { font-size: 12px; color: #d32f2f; background: #ffebee; padding: 8px; border-radius: 6px; text-align: center; }
        .loading { text-align: center; color: #777; margin-top: 40px; font-size: 15px; }

        /* 하단 외부 링크 버튼 스타일 */
        .link-buttons-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 35px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .external-btn {
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
            text-align: center;
            flex: 1;
            min-width: 180px;
            max-width: 250px;
        }
        .external-btn:hover {
            transform: translateY(-2px);
        }
        .btn-saju { background-color: #0b3c5d; }
        .btn-saju:hover { background-color: #124e78; }
        .btn-yeok { background-color: #1e6f3d; }
        .btn-yeok:hover { background-color: #278c4d; }
        .btn-cafe { background-color: #b71c1c; }
        .btn-cafe:hover { background-color: #c62828; }

        /* 사용자 인증 코드 박스 스타일 */
        .auth-code-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin: 0 auto 35px auto;
            max-width: 420px;
            gap: 12px;
            border: 1px solid #d0e1fd;
        }
        .auth-btn-label {
            background-color: #455a64;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: default;
        }
        .auth-code { font-size: 16px; font-weight: bold; color: #d32f2f; background: #ffebee; padding: 4px 10px; border-radius: 6px; letter-spacing: 1px; }
        .copy-btn { background: #0b3c5d; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s; }
        .copy-btn:hover { background: #124e78; }

        /* 전체 화면 뷰어 스타일 */
        #viewer-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #121212; color: #fff; flex-direction: column; z-index: 1000; }
        .top-player { position: fixed; top: 0; left: 0; width: 100%; background: #1f1f1f; padding: 12px 15px; box-sizing: border-box; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 8px; }
        .top-player audio { width: 100%; }
        .player-info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .back-btn { color: #90caf9; text-decoration: none; font-weight: bold; cursor: pointer; }
        .playlist-status { color: #ffeb3b; font-weight: bold; }
        
        /* 💡 반복재생 체크박스 스타일 */
        .repeat-label { color: #fff; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
        .repeat-label input { width: 15px; height: 15px; cursor: pointer; accent-color: #2e7d32; }

        .lyrics-container { margin-top: 150px; padding: 25px 20px; overflow-y: auto; flex: 1; text-align: center; line-height: 2.2; font-size: 17px; }
        .lyric-line { color: #777; transition: all 0.2s ease; margin: 20px 0; padding: 8px 12px; border-radius: 8px; }
        .lyric-line.active { color: #ffeb3b; font-size: 20px; font-weight: bold; background: rgba(255, 235, 59, 0.15); transform: scale(1.03); }
    </style>
</head>
<body>
    <div id="main-view">
        <h2>📜 誦書律唱(송서율창) 클라우드</h2>
        <div class="subtitle">과목 ➔ 분류 ➔ 문서 아코디언 트리 시스템 (순서 정렬 적용)</div>
        <div id="app" class="loading">데이터를 불러오는 중입니다...</div>

        <!-- 외부 링크 버튼 영역 -->
        <div class="link-buttons-container">
            <a href="https://cskim120.pythonanywhere.com/" target="_blank" class="external-btn btn-saju">🔮 자미두수 명반&心易(심역)</a>
            <a href="https://tajanx.pythonanywhere.com/" target="_blank" class="external-btn btn-yeok">📜 선천 역서(先天 易數)</a>
            <a href="https://cafe.daum.net/kangchang" target="_blank" class="external-btn btn-cafe">☕ 강철의 心易 자미두수-사이트</a>
        </div>

        <!-- 사용자 인증 코드 버튼 및 출력 영역 -->
        <div class="auth-code-container">
            <div class="auth-btn-label">사용자 인증 코드</div>
            <span id="authCodeText" class="auth-code">로딩중...</span>
            <button class="copy-btn" onclick="copyAuthCode()">📋 복사하기</button>
        </div>
    </div>

    <!-- 전체 화면 자막 동기화 뷰어 -->
    <div id="viewer-container">
        <div class="top-player">
            <div class="player-info-row">
                <a class="back-btn" onclick="closeViewer()">⬅ 목록으로 돌아가기</a>
                <span id="playlistStatus" class="playlist-status">재생 중: 1 / 1</span>
                <!-- 💡 반복재생 체크박스 추가 -->
                <label class="repeat-label">
                    <input type="checkbox" id="repeatCheckbox"> 🔁 반복재생
                </label>
            </div>
            <audio id="audioPlayer" controls></audio>
        </div>
        <div class="lyrics-container" id="lyricsContainer"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://vdiogfisdouzvtnpuvoc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_fgXbc2B32uYh8lWgqtFSjA_IaP2-4AG";
        
        let supabaseClient;
        let allDocuments = [];
        
        let currentPlaylist = [];
        let currentPlaylistIndex = 0;

        function initMonthlyAuthCode() {
            try {
                const secretSalt = "My_Super_Secret_Key_2026_StudyRoom!";
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const combined = `${secretSalt}_${year}-${month}`;
                const hash = CryptoJS.MD5(combined).toString();
                const code = hash.substring(0, 8).toUpperCase();
                document.getElementById('authCodeText').textContent = code;
            } catch (e) {
                document.getElementById('authCodeText').textContent = "ERROR";
            }
        }

        function copyAuthCode() {
            const codeText = document.getElementById('authCodeText').textContent;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(codeText).then(() => {
                    alert('인증 코드가 복사되었습니다: ' + codeText);
                }).catch(() => { fallbackCopy(codeText); });
            } else {
                fallbackCopy(codeText);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                alert('인증 코드가 복사되었습니다: ' + text);
            } catch (err) {
                alert('복사 실패. 코드를 직접 복사해 주세요.');
            }
            document.body.removeChild(textarea);
        }

        function naturalSort(a, b) {
            return a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' });
        }

        async function loadData() {
            const appDiv = document.getElementById('app');
            try {
                if (!window.supabase) {
                    throw new Error("Supabase 스크립트가 로드되지 않았습니다.");
                }
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                const { data, error } = await supabaseClient
                    .from('documents')
                    .select('id, category, sub_category, title, audio_url, content, sync_data');

                if (error) throw error;
                if (!data || data.length === 0) {
                    appDiv.innerHTML = '<div style="text-align:center; color:#777; margin-top:40px;">저장된 문서가 없습니다.</div>';
                    return;
                }

                allDocuments = data;
                const treeData = {};
                
                data.forEach(row => {
                    const cat = row.category || "기타";
                    const sub = row.sub_category ? row.sub_category.trim() : "";
                    
                    if (!treeData[cat]) {
                        treeData[cat] = { _files: [], _subcats: {} };
                    }

                    if (sub === "") {
                        treeData[cat]._files.push(row);
                    } else {
                        if (!treeData[cat]._subcats[sub]) {
                            treeData[cat]._subcats[sub] = [];
                        }
                        treeData[cat]._subcats[sub].push(row);
                    }
                });

                let html = '';
                const sortedCategories = Object.keys(treeData).sort(naturalSort);

                for (const cat of sortedCategories) {
                    const content = treeData[cat];
                    html += `<details><summary class="cat-summary">📚 ${cat}</summary><div style="padding: 10px;">`;
                    
                    if (content._files.length > 0) {
                        content._files.sort((a, b) => naturalSort(a.title, b.title));
                        const folderId = `cat_${cat.replace(/[^a-zA-Z0-9]/g, '_')}`;
                        html += `
                            <div class="folder-controls">
                                <label><input type="checkbox" onchange="toggleSelectAll(this, '${folderId}')"> 전체선택</label>
                                <button class="btn-playlist-play" onclick="playSelectedFolder('${folderId}')">▶ 선택한 문서 연속 재생</button>
                            </div>
                            <div id="${folderId}">
                        `;
                        content._files.forEach(doc => {
                            html += renderDocBox(doc, folderId);
                        });
                        html += `</div>`;
                    }

                    const sortedSubcats = Object.keys(content._subcats).sort(naturalSort);
                    for (const subcat of sortedSubcats) {
                        const docs = content._subcats[subcat];
                        docs.sort((a, b) => naturalSort(a.title, b.title));
                        const folderId = `sub_${cat.replace(/[^a-zA-Z0-9]/g, '_')}_${subcat.replace(/[^a-zA-Z0-9]/g, '_')}`;
                        
                        html += `<details class="subcat-summary"><summary>📁 ${subcat}</summary>`;
                        html += `
                            <div class="folder-controls">
                                <label><input type="checkbox" onchange="toggleSelectAll(this, '${folderId}')"> 전체선택</label>
                                <button class="btn-playlist-play" onclick="playSelectedFolder('${folderId}')">▶ 선택한 문서 연속 재생</button>
                            </div>
                            <div id="${folderId}" style="padding: 5px;">
                        `;
                        docs.forEach(doc => {
                            html += renderDocBox(doc, folderId);
                        });
                        html += `</div></details>`;
                    }

                    html += `</div></details>`;
                }

                appDiv.innerHTML = html;
            } catch (err) {
                appDiv.innerHTML = `<div style="text-align:center; color:#d32f2f; margin-top:40px;">데이터 로드 오류: ${err.message}</div>`;
            }
        }

        function renderDocBox(doc, folderId) {
            let audioName = `${doc.title}.mp3`;
            let audioContentHtml = doc.audio_url ? `
                <div class="audio-label">🎵 ${audioName}</div>
                <a class="btn-view" onclick="openViewerByTitle('${escapeTitle(doc.title)}')">📖 정밀 자막과 함께 듣기</a>
                <a class="btn-download" onclick="downloadAudioFile('${doc.audio_url}', '${escapeTitle(audioName)}')">📥 다운로드 (${audioName})</a>
            ` : `<div class="no-audio">⚠️ 연결된 오디오 파일이 없습니다.</div>`;

            return `
                <div class="doc-summary">
                    <details style="flex:1; margin:0; background:transparent; box-shadow:none;">
                        <summary style="padding:10px 12px;">📄 ${doc.title}</summary>
                        <div class="doc-content">
                            ${audioContentHtml}
                        </div>
                    </details>
                    <input type="checkbox" class="doc-checkbox ${folderId}" value="${doc.title}">
                </div>
            `;
        }

        function toggleSelectAll(masterCheckbox, folderId) {
            const checkboxes = document.querySelectorAll(`input.doc-checkbox.${folderId}`);
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        function playSelectedFolder(folderId) {
            const checkboxes = document.querySelectorAll(`input.doc-checkbox.${folderId}:checked`);
            if (checkboxes.length === 0) {
                alert("재생할 문서를 하나 이상 선택해주세요.");
                return;
            }

            currentPlaylist = [];
            checkboxes.forEach(cb => {
                const doc = allDocuments.find(d => d.title === cb.value);
                if (doc && doc.audio_url) {
                    currentPlaylist.push(doc);
                }
            });

            if (currentPlaylist.length === 0) {
                alert("선택된 문서 중 오디오가 연결된 파일이 없습니다.");
                return;
            }

            currentPlaylistIndex = 0;
            startPlaylistPlayback();
        }

        function openViewerByTitle(title) {
            const doc = allDocuments.find(d => d.title === title);
            if (!doc || !doc.audio_url) {
                alert("연결된 오디오 파일이 없습니다.");
                return;
            }
            currentPlaylist = [doc];
            currentPlaylistIndex = 0;
            startPlaylistPlayback();
        }

        function startPlaylistPlayback() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('viewer-container').style.display = 'flex';
            loadAndPlayIndex(currentPlaylistIndex);
        }

        function loadAndPlayIndex(index) {
            if (index < 0 || index >= currentPlaylist.length) return;
            currentPlaylistIndex = index;

            const doc = currentPlaylist[index];
            document.getElementById('playlistStatus').textContent = `재생 중: ${index + 1} / ${currentPlaylist.length} (${doc.title})`;

            const audio = document.getElementById('audioPlayer');
            audio.src = doc.audio_url || '';

            const container = document.getElementById('lyricsContainer');
            container.innerHTML = '';

            const finalSentences = [];
            if (doc.content) {
                doc.content.split(/\r?\n/).forEach(line => {
                    if (!line.trim()) return;
                    const matches = line.match(/([^\r\n.!?]+[.!?]*['"”’]*)/g);
                    if (matches) {
                        matches.forEach(m => {
                            const s = m.trim();
                            if (s) finalSentences.push(s);
                        });
                    } else {
                        finalSentences.push(line.trim());
                    }
                });
            }
            if (finalSentences.length === 0) finalSentences.push("내용이 없습니다.");

            finalSentences.forEach((sent, idx) => {
                const div = document.createElement('div');
                div.className = 'lyric-line';
                div.id = 'line-' + idx;
                div.textContent = sent;
                container.appendChild(div);
            });

            const lines = document.querySelectorAll('.lyric-line');
            let rawSyncData = doc.sync_data;

            audio.ontimeupdate = () => {
                if (!audio.duration || isNaN(audio.duration) || lines.length === 0) return;
                const currentTime = audio.currentTime;
                let activeIndex = 0;

                if (rawSyncData && Array.isArray(rawSyncData) && rawSyncData.length === finalSentences.length) {
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (currentTime >= rawSyncData[i].start && currentTime <= rawSyncData[i].end) {
                            activeIndex = i;
                            break;
                        } else if (currentTime > rawSyncData[rawSyncData.length - 1].end) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else if (rawSyncData && Array.isArray(rawSyncData)) {
                    const progress = currentTime / audio.duration;
                    for (let i = 0; i < rawSyncData.length; i++) {
                        if (progress >= rawSyncData[i].start_ratio && progress <= rawSyncData[i].end_ratio) {
                            activeIndex = i;
                            break;
                        } else if (progress > rawSyncData[rawSyncData.length - 1].end_ratio) {
                            activeIndex = rawSyncData.length - 1;
                        }
                    }
                } else {
                    const progress = currentTime / audio.duration;
                    activeIndex = Math.min(Math.floor(progress * finalSentences.length), finalSentences.length - 1);
                }

                lines.forEach((line, idx) => {
                    if (idx === activeIndex) {
                        if (!line.classList.contains('active')) {
                            line.classList.add('active');
                            line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        line.classList.remove('active');
                    }
                });
            };

            // 💡 곡이 끝났을 때 반복재생 체크 여부에 따라 다음 곡 또는 처음으로 이동
            audio.onended = () => {
                const isRepeat = document.getElementById('repeatCheckbox').checked;
                if (currentPlaylistIndex + 1 < currentPlaylist.length) {
                    loadAndPlayIndex(currentPlaylistIndex + 1);
                } else {
                    if (isRepeat) {
                        loadAndPlayIndex(0); // 플레이리스트 처음부터 다시 반복
                    } else {
                        alert("모든 곡의 재생이 완료되었습니다.");
                        closeViewer();
                    }
                }
            };

            audio.play().catch(e => console.log("자동 재생 제한:", e));
        }

        function escapeTitle(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        async function downloadAudioFile(url, filename) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.download = filename;
                a.click();
            }
        }

        function closeViewer() {
            const audio = document.getElementById('audioPlayer');
            audio.pause();
            audio.currentTime = 0;
            audio.onended = null;
            document.getElementById('viewer-container').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        document.addEventListener("DOMContentLoaded", () => {
            initMonthlyAuthCode();
            loadData();
        });
    </script>
</body>
</html>
